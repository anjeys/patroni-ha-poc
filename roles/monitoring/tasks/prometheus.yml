---
- name: Create the prometheus system user
  ansible.builtin.user:
    name: prometheus
    system: true
    shell: /usr/sbin/nologin
    home: /var/lib/prometheus
    create_home: false

- name: Download the pinned Prometheus release
  ansible.builtin.get_url:
    url: >-
      https://github.com/prometheus/prometheus/releases/download/v{{
      prometheus_version }}/prometheus-{{ prometheus_version }}.linux-amd64.tar.gz
    dest: "/usr/local/src/prometheus-{{ prometheus_version }}.tar.gz"
    checksum: "sha256:{{ prometheus_sha256 }}"
    mode: "0644"

- name: Unpack Prometheus
  ansible.builtin.unarchive:
    src: "/usr/local/src/prometheus-{{ prometheus_version }}.tar.gz"
    dest: /usr/local/src
    remote_src: true
    creates: "/usr/local/src/prometheus-{{ prometheus_version }}.linux-amd64/prometheus"

- name: Install Prometheus
  ansible.builtin.copy:
    src: "/usr/local/src/prometheus-{{ prometheus_version }}.linux-amd64/{{ item }}"
    dest: "/usr/local/bin/{{ item }}"
    remote_src: true
    mode: "0755"
  loop: [prometheus, promtool]
  notify: Restart prometheus

- name: Prometheus directories
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    owner: prometheus
    group: prometheus
    mode: "0750"
  loop: [/etc/prometheus, /var/lib/prometheus]

# The lab CA (every scrape verifies its target against it) and this host's certificate (the web
# listener serves it; scripts/lab.sh status verifies it) - ADR-0010.
- name: CA, certificate and key for Prometheus
  ansible.builtin.copy:
    src: "../../../.pki/{{ item.src }}"
    dest: "/etc/prometheus/{{ item.dest }}"
    owner: prometheus
    group: prometheus
    mode: "{{ item.mode }}"
  loop:
    - {src: ca.crt, dest: ca.crt, mode: "0644"}
    - {src: "{{ inventory_hostname }}.crt", dest: server.crt, mode: "0644"}
    - {src: "{{ inventory_hostname }}.key", dest: server.key, mode: "0600"}
  loop_control:
    label: "{{ item.dest }}"
  notify: Restart prometheus

- name: Prometheus web config (TLS), checked by promtool
  ansible.builtin.template:
    src: web.yml.j2
    dest: /etc/prometheus/web.yml
    owner: prometheus
    group: prometheus
    mode: "0640"
    validate: "/usr/local/bin/promtool check web-config %s"
  vars:
    web_cert_file: /etc/prometheus/server.crt
    web_key_file: /etc/prometheus/server.key
  notify: Restart prometheus

# The exporter's role: pg_monitor, a password, no superuser. Through the VIP once the cluster
# answers (this play runs after the access layer); idempotent through DO and ALTER.
- name: The postgres_exporter role with pg_monitor
  ansible.builtin.command:
    argv:
      - psql
      - "host={{ pg_access_vip }} port=5000 user=postgres sslmode=verify-full sslrootcert=/var/lib/postgresql/ca.crt"
      - -v
      - ON_ERROR_STOP=1
      - -Atc
      - |
        DO $$ BEGIN
          IF NOT EXISTS (SELECT 1 FROM pg_roles WHERE rolname = 'postgres_exporter') THEN
            CREATE ROLE postgres_exporter LOGIN;
          END IF;
        END $$;
        ALTER ROLE postgres_exporter PASSWORD '{{ pg_exporter_password }}';
        GRANT pg_monitor TO postgres_exporter;
  environment:
    PGPASSWORD: "{{ pg_superuser_password }}"
  changed_when: false
  no_log: true

# promtool validates before the file lands: a typo in a rule stops the play
# instead of leaving Prometheus running on the last good configuration.
- name: Scrape configuration and alerting rules
  ansible.builtin.template:
    src: "{{ item.src }}"
    dest: "/etc/prometheus/{{ item.dest }}"
    owner: prometheus
    group: prometheus
    mode: "0640"
    validate: "{{ item.validate }}"
  loop:
    # Rules first: promtool check config reads rule_files and fails on a path
    # that is not there yet, so the configuration cannot be validated before
    # the file it points at exists.
    - src: rules.yml.j2
      dest: rules.yml
      validate: "/usr/local/bin/promtool check rules %s"
    - src: prometheus.yml.j2
      dest: prometheus.yml
      validate: "/usr/local/bin/promtool check config %s"
  notify: Restart prometheus

- name: Prometheus unit
  ansible.builtin.template:
    src: prometheus.service.j2
    dest: /etc/systemd/system/prometheus.service
    mode: "0644"
  notify: Restart prometheus

- name: Start Prometheus
  ansible.builtin.systemd:
    name: prometheus
    state: started
    enabled: true
    daemon_reload: true
