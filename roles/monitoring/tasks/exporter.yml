---
- name: Download the pinned postgres_exporter release
  ansible.builtin.get_url:
    url: >-
      https://github.com/prometheus-community/postgres_exporter/releases/download/v{{
      postgres_exporter_version }}/postgres_exporter-{{ postgres_exporter_version }}.linux-amd64.tar.gz
    dest: "/usr/local/src/postgres_exporter-{{ postgres_exporter_version }}.tar.gz"
    checksum: "sha256:{{ postgres_exporter_sha256 }}"
    mode: "0644"

- name: Unpack postgres_exporter
  ansible.builtin.unarchive:
    src: "/usr/local/src/postgres_exporter-{{ postgres_exporter_version }}.tar.gz"
    dest: /usr/local/src
    remote_src: true
    creates: "/usr/local/src/postgres_exporter-{{ postgres_exporter_version }}.linux-amd64/postgres_exporter"

- name: Install postgres_exporter
  ansible.builtin.copy:
    src: "/usr/local/src/postgres_exporter-{{ postgres_exporter_version }}.linux-amd64/postgres_exporter"
    dest: /usr/local/bin/postgres_exporter
    remote_src: true
    mode: "0755"
  notify: Restart postgres_exporter

- name: Exporter configuration directory
  ansible.builtin.file:
    path: /etc/postgres_exporter
    state: directory
    owner: postgres
    group: postgres
    mode: "0750"

# TLS with the node's certificate (roles/patroni placed it, readable by postgres - the exporter's
# user) through the exporter-toolkit web config; Prometheus verifies it against the lab CA (ADR-0010).
- name: Exporter web config (TLS)
  ansible.builtin.template:
    src: web.yml.j2
    dest: /etc/postgres_exporter/web.yml
    owner: postgres
    group: postgres
    mode: "0640"
  vars:
    web_cert_file: /etc/patroni/server.crt
    web_key_file: /etc/patroni/server.key
  notify: Restart postgres_exporter

# TCP to the local PostgreSQL over TLS verified against the lab CA, as postgres_exporter - a role
# with pg_monitor, not the superuser (made once the cluster answers, roles/monitoring on the
# repository host). The unit carries the role's password: root reads it, nobody else.
- name: Postgres_exporter unit
  ansible.builtin.template:
    src: postgres_exporter.service.j2
    dest: /etc/systemd/system/postgres_exporter.service
    mode: "0600"
  notify: Restart postgres_exporter

- name: Start postgres_exporter
  ansible.builtin.systemd:
    name: postgres_exporter
    state: started
    enabled: true
    daemon_reload: true
