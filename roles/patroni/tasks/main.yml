---
- name: PostgreSQL, Patroni and the etcd client, pinned
  ansible.builtin.apt:
    name:
      - "postgresql-{{ postgresql_version }}={{ postgresql_package_version }}"
      - "patroni={{ patroni_version }}"
      - "python3-psycopg2={{ psycopg2_version }}"
      - python3-etcd
    state: present

- name: Drop-in directory for the Patroni unit
  ansible.builtin.file:
    path: /etc/systemd/system/patroni.service.d
    state: directory
    mode: "0755"

# The device node is root-owned 0600 every time the container starts and
# Patroni runs as postgres. The + prefix runs the chown with full privileges.
- name: Patroni may open the watchdog device
  ansible.builtin.copy:
    dest: /etc/systemd/system/patroni.service.d/watchdog.conf
    content: |
      [Service]
      ExecStartPre=+/bin/sh -c 'test -c /dev/watchdog && chown postgres:postgres /dev/watchdog || true'
    mode: "0644"
  notify: Restart Patroni

# The lab CA and this node's certificate (scripts/lab.sh pki): PostgreSQL serves it, the replicas
# and PgBouncer verify it against the CA (verify-full), Patroni reaches etcd over TLS with the CA.
# One self-signed certificate per node was the form before ADR-0009.
- name: CA, certificate and key for PostgreSQL and Patroni
  ansible.builtin.copy:
    src: "../../../.pki/{{ item.src }}"
    dest: "/etc/patroni/{{ item.dest }}"
    owner: postgres
    group: postgres
    mode: "{{ item.mode }}"
  loop:
    - {src: ca.crt, dest: ca.crt, mode: "0644"}
    - {src: "{{ inventory_hostname }}.crt", dest: server.crt, mode: "0644"}
    - {src: "{{ inventory_hostname }}.key", dest: server.key, mode: "0600"}
  loop_control:
    label: "{{ item.dest }}"
  notify: Restart Patroni

- name: Deploy Patroni configuration
  ansible.builtin.template:
    src: patroni.yml.j2
    dest: /etc/patroni/config.yml
    owner: postgres
    group: postgres
    mode: "0600"
  notify: Restart Patroni

- name: Start Patroni service
  ansible.builtin.systemd:
    name: patroni
    state: started
    enabled: true
    daemon_reload: true
