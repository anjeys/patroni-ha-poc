---
# The bots (ADR-0007). Dependabot moves every action's commit sha and the tag beside it, the
# base image's digest in the Dockerfile and the pinned python tools of requirements-ci.txt;
# each as a pull request the lint workflow checks. Apt pins are branches (ADR-0006) and need
# no bot. Renovate would do the same with grouping and is the recorded alternative.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    # v2.6.0 has no container image on ghcr (manifest unknown): the security
    # workflow would go red on main, and it does not run on a pull request (PR #13)
    ignore:
      - dependency-name: ossf/scorecard-action
        versions: ["2.6.0"]
  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
      day: monday
    # the base image is the Ubuntu LTS the PGDG repository (noble-pgdg) is built for: a new
    # major is a decision and a new repository line, not a weekly bump (PR #10 bumped to 26.04,
    # PR #12 to 24.10 - a non-LTS PGDG has no line for); the digest moves with a deliberate commit
    ignore:
      - dependency-name: ubuntu
  - package-ecosystem: pip
    directory: /
    schedule:
      interval: weekly
      day: monday
