---
# What the repository looks like from outside, scored: OpenSSF Scorecard on every push to main and
# weekly, the results published (the README badge reads them). Code scanning (CodeQL on the python
# and the workflows) is GitHub's default setup, enabled on the repository, not a workflow here;
# Dependabot alerts and secret scanning likewise (ADR-0007). Actions pinned by sha, egress audited.
name: security
"on":
  push:
    branches: [main]
  schedule:
    - cron: "41 4 * * 2"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  scorecard:
    name: OpenSSF Scorecard
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
      actions: read
      id-token: write
    steps:
      - uses: step-security/harden-runner@aebdcf6156ab6691adf63218240e476564a1ed4c  # v2.23.0
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: ossf/scorecard-action@23f22cd43608bae7a1f1fa2603d7314dee9538a5  # v2.6.0
        with:
          results_file: results.sarif
          results_format: sarif
          publish_results: true
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: scorecard-${{ github.run_id }}
          path: results.sarif
          retention-days: 30
