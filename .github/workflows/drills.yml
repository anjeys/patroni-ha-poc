---
# The cluster is built on the runner and every drill runs against it. systemd
# as PID 1 needs --privileged, which GitHub-hosted runners allow; nothing else
# is special. Weekly, so a drift in a pinned branch or in Patroni's behaviour
# shows up as a red run with evidence attached; and on every pull request that
# touches the cluster's code - the minutes are free on a public repository and
# ten of them on a branch beat a red Monday on main (ADR-0007). The evidence is
# an artifact of the run and a table in the job's summary.
name: drills
"on":
  workflow_dispatch:
  schedule:
    - cron: "23 3 * * 1"
  pull_request:
    paths:
      - .github/workflows/drills.yml
      - Dockerfile
      - docker-compose.yml
      - docker-compose.watchdog.yml
      - inventory.ini.tpl
      - playbook.yml
      - requirements-ci.txt
      - group_vars/**
      - roles/**
      - scripts/**
permissions:
  contents: read
concurrency:
  group: drills-${{ github.ref }}
  cancel-in-progress: false
jobs:
  drills:
    name: build the cluster, run every drill
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: step-security/harden-runner@aebdcf6156ab6691adf63218240e476564a1ed4c  # v2.23.0
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
        with:
          python-version: "3.13"
          cache: pip
      - name: Tools
        run: |
          set -euo pipefail
          pip install -r requirements-ci.txt
          # softdog with soft_noboot=1: the watchdog proves itself in the
          # kernel log instead of rebooting the runner. A kernel without the
          # module runs the cluster unfenced, and the evidence says so.
          # modprobe on an already-loaded module is a no-op, parameters and
          # all: the runner had softdog in with soft_noboot=0 and lab.sh
          # rightly declined the device. Unload first, then ask for the
          # parameter, and print what the kernel actually gave.
          sudo modprobe -r softdog 2>/dev/null || true
          sudo modprobe softdog soft_noboot=1 || echo "no softdog on this kernel"
          # The parameter is not in sysfs; the kernel log is where it shows.
          sudo dmesg | grep "softdog: initialized" | tail -1 || echo "softdog never initialized"
      - name: Up, then prove a second run changes nothing
        run: |
          set -euo pipefail
          scripts/lab.sh up
          scripts/lab.sh check
          scripts/lab.sh status
          scripts/lab.sh versions
      - name: Cluster state before the drills
        run: |
          docker exec node1 patronictl -c /etc/patroni/config.yml list
          docker exec -u postgres backup pgbackrest --stanza=main info
      - name: Drill - access layer
        run: scripts/drill.sh access
      - name: Drill - failover
        run: scripts/drill.sh failover
      - name: Drill - point-in-time recovery
        run: scripts/drill.sh pitr
      - name: Cluster state after the drills
        if: always()
        run: docker exec node1 patronictl -c /etc/patroni/config.yml list || true
      - name: Evidence summary
        if: always()
        run: python3 scripts/lib/evidence_summary.py | tee -a "$GITHUB_STEP_SUMMARY"
      - name: Evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: drill-evidence-${{ github.run_id }}
          path: evidence/
          if-no-files-found: warn
          retention-days: 90
